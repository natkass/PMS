server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;  # React build copied here
    index index.html;

    location /pms/ {
        alias /usr/share/nginx/html/pms/;
        index index.html;
        try_files $uri $uri/ /pms/index.html;
    }

    location /pms/api/ {
        proxy_pass http://pms-backend:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # WebSocket / Socket.IO
    # location /pms/socket/ {
    #     proxy_pass http://pms-backend:5001;
    #     proxy_http_version 1.1;

    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "Upgrade";

    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;

    #     proxy_read_timeout 86400;
    #     proxy_send_timeout 86400;
    # }

    location /static/ {
        alias /usr/share/nginx/html/pms/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
