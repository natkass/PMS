  version: "3.9"

  networks:
    pms-network:
      driver: bridge
    monitoring:
      driver: bridge

  volumes:
    db-data:
    static_volume:
    media_volume:
    redisdata:
    grafana_data:
    prometheus_data:

  services:
    backend:
      build: ./PMS-backend
      container_name: pms-backend
      env_file:
        - .env
      environment:
        NODE_ENV: production
        PORT: 5000
        DB_HOST: ${DB_HOST}
        DB_PORT: ${DB_PORT}
        DB_NAME: ${DB_NAME}
        MYSQL_ROOT_PASSWORD: ${DB_PASS}
        MYSQL_DATABASE: ${DB_NAME}
        MYSQL_USER: ${DB_USER}
        MYSQL_PASSWORD: ${DB_PASS}
      ports:
        - "5000:5000"
        - "5001:5001"
      restart: always
      networks:
        - pms-network
      dns:
        - 8.8.8.8
        - 1.1.1.1

    frontend:
      build: ./Frontend
      container_name: pms-frontend
      environment:
        REACT_APP_API_URL: /pms/api
      restart: always
      networks:
        - pms-network
      dns:
        - 8.8.8.8
        - 1.1.1.1

    db:
      image: mysql:8.1
      container_name: pms-db
      env_file:
        - .env
      environment:
        MYSQL_ROOT_PASSWORD: ${DB_PASS}
        MYSQL_DATABASE: ${DB_NAME}
        MYSQL_USER: ${DB_USER}
        MYSQL_PASSWORD: ${DB_PASS}
      volumes:
        - db-data:/var/lib/mysql
      command: --default-authentication-plugin=mysql_native_password
      restart: always
      networks:
        - pms-network
      dns:
        - 8.8.8.8
        - 1.1.1.1

    nginx:
      image: nginx:alpine
      container_name: pms-nginx
      ports:
        - "80:80"
      volumes:
        # - ./Frontend/build:/usr/share/nginx/html       # React build folder
        # - ./static:/usr/share/nginx/static
        # - ./media:/usr/share/nginx/media
        - ./nginx/conf.d:/etc/nginx/conf.d
      depends_on:
        - backend
        - frontend
      networks:
        - pms-network
        - monitoring

    loki:
      image: grafana/loki:2.8.2
      container_name: loki
      command: -config.file=/etc/loki/local-config.yaml
      volumes:
        - ./monitoring/loki/local-config.yaml:/etc/loki/local-config.yaml:ro
        - ./monitoring/loki/data:/loki
      networks:
        - monitoring
      restart: always
      
    promtail:
      image: grafana/promtail:2.8.2
      container_name: promtail
      command: -config.file=/etc/promtail/config.yml
      volumes:
        - /var/log:/var/log:ro
        - /var/lib/docker/containers:/var/lib/docker/containers:ro
        - ./monitoring/promtail/config.yml:/etc/promtail/config.yml:ro
      networks:
        - monitoring
      restart: always

    prometheus:
      image: prom/prometheus:latest
      container_name: prometheus
      command:
        - "--config.file=/etc/prometheus/prometheus.yml"
        - "--storage.tsdb.path=/prometheus"
        - "--web.enable-lifecycle"
      volumes:
        - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
        - prometheus_data:/prometheus
      ports:
        - "9090:9090"
      networks:
        - monitoring
      restart: always
  
    node-exporter:
      image: prom/node-exporter:latest
      container_name: node-exporter
      restart: always
      networks:
        - monitoring
      pid: host
      command:
        - '--path.rootfs=/host'
      volumes:
        - /:/host:ro,rslave

    grafana:
      image: grafana/grafana:latest
      container_name: grafana
      ports:
        - "3000:3000"
      environment:
        - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
        - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme}
        - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s:%(http_port)s/pms/grafana
        - GF_SERVER_SERVE_FROM_SUB_PATH=true
      volumes:
        - grafana_data:/var/lib/grafana
      networks:
        - monitoring
      restart: always