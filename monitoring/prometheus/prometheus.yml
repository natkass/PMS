global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Backend metrics (if exposed)
  - job_name: "pms-backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["pms-backend:5000"]

  # Loki metrics
  - job_name: "loki"
    static_configs:
      - targets: ["loki:3100"]

  # Grafana metrics
  - job_name: "grafana"
    static_configs:
      - targets: ["grafana:3000"]

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
